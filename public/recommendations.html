<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Recommendations - Crossword Trainer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-link {
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .puzzle-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .puzzle-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .puzzle-date {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    .puzzle-score {
      font-size: 24px;
      font-weight: bold;
      color: #28a745;
    }
    .puzzle-score.medium {
      color: #ffc107;
    }
    .puzzle-score.low {
      color: #dc3545;
    }
    .puzzle-stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }
    .puzzle-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .puzzle-link {
      display: inline-block;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }
    .puzzle-link:hover {
      background: #0056b3;
    }
    .details-toggle {
      background: none;
      border: 1px solid #ddd;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      color: #666;
    }
    .details-toggle:hover {
      background: #f8f9fa;
    }
    .clue-details {
      display: none;
      margin-top: 16px;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }
    .clue-details.open {
      display: block;
    }
    .clue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .clue-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 13px;
    }
    .clue-score {
      min-width: 45px;
      font-weight: 600;
      text-align: center;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .clue-score.high {
      background: #d4edda;
      color: #155724;
    }
    .clue-score.medium {
      background: #fff3cd;
      color: #856404;
    }
    .clue-score.low {
      background: #f8d7da;
      color: #721c24;
    }
    .clue-score.none {
      background: #e9ecef;
      color: #6c757d;
    }
    .clue-score.missing {
      background: #fce4ec;
      color: #c2185b;
    }
    .clue-item.missing-answer {
      opacity: 0.7;
    }
    .clue-info {
      flex: 1;
    }
    .clue-text {
      color: #333;
    }
    .clue-answer {
      font-family: monospace;
      font-weight: 600;
      color: #333;
      min-width: 80px;
      text-align: right;
      letter-spacing: 1px;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Recommendations</h1>
    <div class="nav-links">
      <a href="/" class="nav-link">Clues</a>
      <a href="/puzzles.html" class="nav-link">Puzzles</a>
      <a href="/research.html" class="nav-link">Research</a>
      <a href="/quiz.html" class="nav-link">Quiz</a>
      <a href="/performance.html" class="nav-link">Performance</a>
    </div>
  </header>

  <p class="subtitle">Puzzles ranked by expected solvability based on your quiz performance</p>

  <div id="content">
    <div class="loading">Loading recommendations...</div>
  </div>

  <script>
    async function loadRecommendations() {
      const container = document.getElementById('content');

      try {
        const res = await fetch('/api/recommendations');
        if (!res.ok) throw new Error('Failed to load recommendations');

        const data = await res.json();

        if (data.recommendations.length === 0) {
          container.innerHTML = '<div class="empty">No recommendations available. Complete some quizzes first!</div>';
          return;
        }

        container.innerHTML = data.recommendations.map((puzzle, index) => {
          const scoreClass = puzzle.solvabilityScore >= 0.7 ? '' :
                            puzzle.solvabilityScore >= 0.4 ? 'medium' : 'low';

          const nytDate = puzzle.puzzleDate.replace(/-/g, '/');
          const nytUrl = `https://www.nytimes.com/crosswords/game/daily/${nytDate}`;

          // Sort clues by contribution (length × wilsonScore) descending
          const sortedClues = [...puzzle.clues].sort((a, b) => {
            const contribA = a.length * a.wilsonScore;
            const contribB = b.length * b.wilsonScore;
            return contribB - contribA;
          });

          const clueItems = sortedClues.map(clue => {
            let scoreClass, scoreDisplay;
            if (!clue.hasAnswer) {
              scoreClass = 'missing';
              scoreDisplay = 'N/A';
            } else if (clue.attempts === 0) {
              scoreClass = 'none';
              scoreDisplay = '-';
            } else if (clue.wilsonScore >= 0.7) {
              scoreClass = 'high';
              scoreDisplay = Math.round(clue.wilsonScore * 100) + '%';
            } else if (clue.wilsonScore >= 0.4) {
              scoreClass = 'medium';
              scoreDisplay = Math.round(clue.wilsonScore * 100) + '%';
            } else {
              scoreClass = 'low';
              scoreDisplay = Math.round(clue.wilsonScore * 100) + '%';
            }

            return `
              <div class="clue-item${!clue.hasAnswer ? ' missing-answer' : ''}">
                <span class="clue-score ${scoreClass}">${scoreDisplay}</span>
                <div class="clue-info">
                  <span class="clue-text">${escapeHtml(clue.text)}</span>
                </div>
                <span class="clue-answer">${clue.answer ? escapeHtml(clue.answer) : '???'}</span>
              </div>
            `;
          }).join('');

          return `
            <div class="puzzle-card">
              <div class="puzzle-header">
                <div>
                  <div class="puzzle-date">${formatDate(puzzle.puzzleDate)}</div>
                </div>
                <div class="puzzle-score ${scoreClass}">${Math.round(puzzle.solvabilityScore * 100)}%</div>
              </div>
              <div class="puzzle-stats">
                <span>${puzzle.expectedSquares} / ${puzzle.totalSquares} expected squares</span>
                <span>${puzzle.answeredClueCount} / ${puzzle.clueCount} clues answered</span>
                <span>${puzzle.quizzedClueCount} / ${puzzle.answeredClueCount} clues quizzed</span>
              </div>
              <div class="puzzle-actions">
                <a href="/?date=${puzzle.puzzleDate}" class="puzzle-link">Review Clues</a>
                <a href="${nytUrl}" target="_blank" class="puzzle-link">Open in NYT</a>
                <button class="details-toggle" onclick="toggleDetails(${index})">Show Details</button>
              </div>
              <div class="clue-details" id="details-${index}">
                <div class="clue-list">
                  ${clueItems}
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `<div class="error">${err.message}</div>`;
      }
    }

    function toggleDetails(index) {
      const details = document.getElementById(`details-${index}`);
      const button = details.previousElementSibling.querySelector('.details-toggle');

      if (details.classList.contains('open')) {
        details.classList.remove('open');
        button.textContent = 'Show Details';
      } else {
        details.classList.add('open');
        button.textContent = 'Hide Details';
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadRecommendations();
  </script>
</body>
</html>
