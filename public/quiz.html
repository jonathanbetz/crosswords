<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Mode - Crossword Practice</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 50vh;
      background: #f5f5f5;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 {
      margin: 0;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-indicator.offline {
      background: #fff3cd;
      color: #856404;
    }
    .status-indicator.syncing {
      background: #cce5ff;
      color: #004085;
    }
    .status-indicator.online {
      background: #d4edda;
      color: #155724;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-indicator.offline .status-dot {
      background: #ffc107;
    }
    .status-indicator.syncing .status-dot {
      background: #007bff;
      animation: pulse 1s infinite;
    }
    .status-indicator.online .status-dot {
      background: #28a745;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-link {
      color: #007bff;
      text-decoration: none;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .quiz-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .clue-text {
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #333;
    }
    .clue-meta {
      font-size: 12px;
      color: #999;
      margin-bottom: 20px;
    }
    .clue-meta .puzzle-link {
      color: #007bff;
      text-decoration: none;
    }
    .clue-meta .puzzle-link:hover {
      text-decoration: underline;
    }
    .letter-inputs {
      display: flex;
      gap: 3px;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
    }
    .letter-input {
      width: 36px;
      min-width: 20px;
      height: 44px;
      padding: 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      background: white;
      flex-shrink: 1;
    }
    .letter-input:focus {
      outline: none;
      border-color: #007bff;
      background: #e3f2fd;
    }
    .letter-input.from-pattern {
      color: #333;
      background: white;
      border-color: #ddd;
    }
    .letter-input.hint-correct {
      color: #2e7d32;
      background: #c8e6c9;
      border-color: #4caf50;
    }
    .letter-input.hint-incorrect {
      color: #c62828;
      background: #ffcdd2;
      border-color: #f44336;
    }
    .letter-input.user-entered {
      color: #333;
    }
    .letter-input.empty {
      background: #fafafa;
    }
    .letter-input.correct {
      background: #c8e6c9;
      border-color: #4caf50;
      color: #2e7d32;
    }
    .letter-input.incorrect {
      background: #ffcdd2;
      border-color: #f44336;
      color: #c62828;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .submit-btn {
      background: #007bff;
      color: white;
    }
    .submit-btn:hover {
      background: #0056b3;
    }
    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .next-btn {
      background: #28a745;
      color: white;
    }
    .next-btn:hover {
      background: #1e7e34;
    }
    .skip-btn {
      background: #6c757d;
      color: white;
    }
    .skip-btn:hover {
      background: #545b62;
    }
    .ignore-btn {
      background: #dc3545;
      color: white;
    }
    .ignore-btn:hover {
      background: #c82333;
    }
    .hint-btn {
      background: #ffc107;
      color: #212529;
    }
    .hint-btn:hover {
      background: #e0a800;
    }
    .hint-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }
    .pause-btn {
      background: #fd7e14;
      color: white;
    }
    .pause-btn:hover {
      background: #e86a0a;
    }
    .result {
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 18px;
    }
    .result.correct {
      background: #c8e6c9;
      color: #2e7d32;
    }
    .result.incorrect {
      background: #ffcdd2;
      color: #c62828;
    }
    .stats {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 20px;
    }
    .clue-stats {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-size: 14px;
    }
    .clue-stats-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }
    .clue-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      text-align: center;
    }
    .stat-item {
      background: white;
      padding: 10px 8px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-top: 4px;
    }
    .stat-detail {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }
    @media (max-width: 500px) {
      .clue-stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .error {
      background: #fee;
      color: #c00;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .streak-display {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .streak-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .streak-label {
      color: #666;
    }
    .streak-value {
      font-weight: bold;
      color: #28a745;
    }
    .streak-value.zero {
      color: #999;
    }
    .hints-display {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
    .hints-count {
      font-weight: bold;
      color: #ffc107;
    }
    .hints-count.zero {
      color: #dc3545;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .toggle-label {
      font-size: 14px;
      color: #666;
      cursor: pointer;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch.active {
      background: #007bff;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch.active::after {
      transform: translateX(20px);
    }
    .session-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #e8f4fd;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .session-retired {
      font-weight: bold;
      color: #0d6efd;
      white-space: nowrap;
    }
    .session-dots-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
    }
    .session-clue-dots {
      display: inline-flex;
      gap: 2px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-filled {
      background: #28a745;
    }
    .dot-empty {
      background: #dee2e6;
    }
    .session-attempts {
      color: #6c757d;
      white-space: nowrap;
      font-size: 12px;
    }
    .session-complete-screen {
      text-align: center;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .session-complete-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    .session-complete-detail {
      font-size: 16px;
      color: #555;
    }
    .session-complete-time {
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Quiz Mode</h1>
      <div id="statusIndicator" class="status-indicator online" style="display: none;">
        <span class="status-dot"></span>
        <span id="statusText">Online</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">Clues</a>
      <a href="/puzzles.html" class="nav-link">Puzzles</a>
      <a href="/recommendations.html" class="nav-link">Recs</a>
      <a href="/research.html" class="nav-link">Research</a>
      <a href="/quiz.html" class="nav-link">Quiz</a>
      <a href="/performance.html" class="nav-link">Performance</a>
      <a href="/learning.html" class="nav-link">Learning</a>
      <a href="#" class="nav-link" onclick="clearCache(); return false;" style="color: #dc3545;">Clear Cache</a>
    </div>
  </header>

  <div class="toggle-container">
    <span class="toggle-label" onclick="toggleIncludeCompleted()">Include completed puzzles</span>
    <div class="toggle-switch" id="includeCompletedToggle" onclick="toggleIncludeCompleted()"></div>
  </div>

  <div id="quiz" class="quiz-card">
    <div class="loading">Loading clue...</div>
  </div>

  <div id="stats" class="stats"></div>

  <script src="/utils/letter-input.js"></script>
  <script src="/quiz.js"></script>
  <script src="/utils/header-stats.js"></script>
</body>
</html>
